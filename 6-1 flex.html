<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冯子格的flex布局</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            padding: 40px;
            background-color: #f7f9fc;
            font-family: "Microsoft Yahei", sans-serif;
        }
        h1{
            text-align: center;
            margin-bottom: 40px;
            color: #2c3e50;
        }
        .wrap{
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        /* 外层四个大盒子 */
        .item{
            width: 260px;
            height: 260px;
            border: 2px solid #8899aa;
            padding: 20px;
        }
        .box{
            background-color: #73a8ff;
            border-radius: 6px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        /* ========== 第一个盒子：1个方块居中 ========== */
        .item1{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .item1 .box{
            width: 70px;
            height: 70px;
        }

        /* ========== 第二个盒子：纵向2个方块 ========== */
        .item2{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap:12px;
        }
        .item2 .box{
            width: 100px;
            height: 45px;
        }

        /* ========== 第三个盒子：2行2列四个方块 ========== */
        .item3{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
        }
        .item3 .box{
            width: 90px;
            height: 45px;
        }

        /* ========== 第四个盒子：上1个通栏，下面并排2个 ========== */
        .item4{
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap:10px;
        }
        .item4 .row-top{
            display:flex;
        }
        .item4 .row-top .box{
            width:100%;
            height:45px;
        }
        .item4 .row-bottom{
            display:flex;
            gap:10px;
        }
        .item4 .row-bottom .box{
            flex:1;
            height:45px;
        }
    </style>
</head>
<body>
    <h1>冯子格的flex布局</h1>
    <div class="wrap">
        <!-- 第1个 -->
        <div class="item item1">
            <div class="box"></div>
        </div>
        <!-- 第2个 -->
        <div class="item item2">
            <div class="box"></div>
            <div class="box"></div>
        </div>
        <!-- 第3个 -->
        <div class="item item3">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
        <!-- 第4个 -->
        <div class="item item4">
            <div class="row-top">
                <div class="box"></div>
            </div>
            <div class="row-bottom">
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>
    </div>
    <div style="text-align:center;margin-top:30px;color:#666;font-size:15px;">
        学号：24006340228
    </div>
</body>
</html>
