<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding:0;
            margin:0;
        }
        #box{
            padding:8px;
            margin:20px;
            border:1px solid #ccc;
            font-size:12px;
            width:480px;
        }
        #box h3{
            font-size:16px;
            line-height:33px;
            text-align:center;
            color:#034;
            letter-spacing:3px;
        }
        #box p{
            color:#666;
            text-indent:2em;
            line-height:150%;
        }
        #box a{
            color:#c00;
            text-decoration:none;
        }
        /* 单个CSS选择器：学号姓名班级，蓝色加粗 */
        .info{
            color: blue;
            font-weight: bold;
        }
        /* 2.h2黑底白字、居中、行高150% */
        h2{
            background-color:#000;
            color:#fff;
            padding:6px 10px;
            margin:15px 20px;
            text-align:center;
            line-height:150%;
        }
        /* 3.知识点蓝底白字 */
        .knowledge{
            background-color:blue;
            color:white;
            padding:2px 4px;
        }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>
    <div id='box'>
        <h3>CSS进阶</h3>
        <p><span class="info">学号：228，姓名：冯子格，班级：计算机24008</span>，《高级网页设计》设计的学习难度：其他，
            本实例的知识点：<span class="knowledge">CSS群组选择器和后代选择器</span>。
            <a href="#">【更多】</a>
        </p>
    </div>
</body>
</html>
