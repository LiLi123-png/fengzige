<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型、box model</title>
</head>
<body>
    <div class="a">228冯子格</div>
    <div class="b">228冯子格</div>
    <div class="c">228冯子格</div>
    <style>
        .a{
            width: 500px;
            height: 500px;
            border: 2px dotted #039;
            padding: 70px 60px 50px 40px; /*上 右 下 左*/
            margin: 40px auto;
        }
        .b{
            width: 500px;
            height: 300px;
            border: 2px dashed blue;
            margin: 50px auto 40px;
        }
        .c{
            width: 500px;
            height: 200px;
            border: 2px solid red;
            padding: 50px 40px 30px 20px;
            margin: 50px auto 40px;
        }
    </style>
</body>
</html>
