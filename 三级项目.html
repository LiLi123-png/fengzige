<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartRadar · 智能车雷达监测平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%232563eb'/%3E%3Ccircle cx='12' cy='12' r='5' fill='none' stroke='white' stroke-width='2'/%3E%3Cline x1='12' y1='12' x2='19' y2='6' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ============================================================
   SmartRadar 智能车雷达监测平台
   全局样式表（Global CSS）  作者类名前缀：fzg-（冯子格）
   ============================================================ */
:root{
  --fzg-primary:#2563eb;
  --fzg-primary-soft:#3b82f6;
  --fzg-cyan:#06b6d4;
  --fzg-bg:#f1f6ff;
  --fzg-surface:#ffffff;
  --fzg-ink:#0f172a;
  --fzg-ink-2:#475569;
  --fzg-ink-3:#94a3b8;
  --fzg-line:#e2e8f0;
  --fzg-ok:#16a34a;
  --fzg-warn:#d97706;
  --fzg-radius:16px;
  --fzg-shadow:0 6px 20px rgba(37,99,235,.10);
  --fzg-tab-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,system-ui,sans-serif;
  background:linear-gradient(160deg,#eaf2ff 0%,#f6faff 45%,#eef7ff 100%);
  color:var(--fzg-ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* App 外壳：移动端优先，桌面居中加两侧氛围 */
.fzg-app{
  max-width:480px;margin:0 auto;min-height:100vh;
  background:linear-gradient(180deg,#eaf2ff 0%,#f8fbff 220px,#ffffff 100%);
  box-shadow:0 0 40px rgba(37,99,235,.08);
  position:relative;padding-bottom:calc(var(--fzg-tab-h) + env(safe-area-inset-bottom));
}
/* ---------- 通用图标系统（iconfont / SVG sprite 等价方案） ---------- */
.fzg-icon{
  width:22px;height:22px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;
}
.fzg-icon--sm{width:16px;height:16px}
.fzg-icon--lg{width:28px;height:28px}
.fzg-icon--fill{fill:currentColor;stroke:none}

/* ---------- 顶部栏 ---------- */
.fzg-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 10px;
}
.fzg-brand{display:flex;align-items:center;gap:10px}
.fzg-brand-dot{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--fzg-primary),var(--fzg-cyan));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:var(--fzg-shadow);
}
.fzg-brand-name{font-size:17px;font-weight:700;letter-spacing:.5px}
.fzg-brand-sub{font-size:11px;color:var(--fzg-ink-3)}
.fzg-topbar-badge{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fzg-primary);
  background:#e0edff;border-radius:999px;padding:6px 12px;font-weight:600;
}
.fzg-live-dot{width:7px;height:7px;border-radius:50%;background:var(--fzg-ok);animation:fzg-pulse 1.6s infinite}
@keyframes fzg-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* ---------- 视图容器 ---------- */
.fzg-view{padding:8px 20px 24px;animation:fzg-fade .3s ease}
@keyframes fzg-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fzg-view-title{font-size:22px;font-weight:800;margin:6px 0 4px}
.fzg-view-desc{font-size:13px;color:var(--fzg-ink-2);margin-bottom:16px;line-height:1.6}

/* ---------- 首页 Hero ---------- */
.fzg-hero{
  border-radius:20px;padding:22px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 55%,#06b6d4 100%);
  box-shadow:0 12px 30px rgba(37,99,235,.35);
}
.fzg-hero h2{font-size:21px;line-height:1.4;margin-bottom:6px}
.fzg-hero p{font-size:13px;opacity:.9;line-height:1.6}
.fzg-hero-stats{display:flex;gap:14px;margin-top:18px}
.fzg-hero-stat{background:rgba(255,255,255,.16);border-radius:12px;padding:10px 12px;flex:1;backdrop-filter:blur(4px)}
.fzg-hero-stat b{display:block;font-size:19px}
.fzg-hero-stat span{font-size:11px;opacity:.85}
/* 雷达扫描动画装饰 */
.fzg-radar{position:absolute;right:-30px;top:-30px;width:150px;height:150px;opacity:.5}
.fzg-radar-sweep{transform-origin:center;animation:fzg-spin 3.5s linear infinite}
@keyframes fzg-spin{to{transform:rotate(360deg)}}

/* ---------- 功能入口卡片 ---------- */
.fzg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.fzg-entry{
  background:var(--fzg-surface);border-radius:var(--fzg-radius);padding:16px;
  border:1px solid var(--fzg-line);cursor:pointer;transition:.2s;
}
.fzg-entry:hover{transform:translateY(-2px);box-shadow:var(--fzg-shadow)}
.fzg-entry-icon{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:#e0edff;color:var(--fzg-primary);margin-bottom:10px;
}
.fzg-entry b{font-size:14px;display:block}
.fzg-entry span{font-size:12px;color:var(--fzg-ink-3)}

/* ---------- 产品列表 ---------- */
.fzg-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.fzg-card{
  background:var(--fzg-surface);border:1px solid var(--fzg-line);border-radius:var(--fzg-radius);
  padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.2s;
}
.fzg-card:hover{box-shadow:var(--fzg-shadow);border-color:#bfdbfe}
.fzg-card-thumb{
  width:54px;height:54px;border-radius:14px;flex:none;
  background:linear-gradient(135deg,#dbeafe,#cffafe);
  display:flex;align-items:center;justify-content:center;color:var(--fzg-primary);
}
.fzg-card-body{flex:1;min-width:0}
.fzg-card-body b{font-size:15px;display:block}
.fzg-card-model{font-size:11px;color:var(--fzg-ink-3);margin:2px 0 6px}
.fzg-card-summary{
  font-size:12px;color:var(--fzg-ink-2);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.fzg-card-meta{display:flex;align-items:center;gap:6px;flex:none}
.fzg-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.fzg-status--on{background:#dcfce7;color:var(--fzg-ok)}
.fzg-status--standby{background:#fef3c7;color:var(--fzg-warn)}
.fzg-arrow{color:var(--fzg-ink-3)}

/* ---------- 详情页 ---------- */
.fzg-detail-hero{
  border-radius:18px;padding:22px;color:#fff;background:linear-gradient(135deg,#0f3aa8,#2563eb);
  margin-bottom:16px;position:relative;overflow:hidden;
}
.fzg-detail-hero .fzg-icon{width:40px;height:40px;opacity:.9}
.fzg-detail-hero h2{font-size:20px;margin-top:10px}
.fzg-detail-hero p{font-size:12px;opacity:.85;margin-top:4px}
.fzg-param-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.fzg-param{background:var(--fzg-surface);border:1px solid var(--fzg-line);border-radius:12px;padding:12px}
.fzg-param span{font-size:11px;color:var(--fzg-ink-3);display:block}
.fzg-param b{font-size:16px;color:var(--fzg-primary)}
.fzg-section{background:var(--fzg-surface);border:1px solid var(--fzg-line);border-radius:14px;padding:16px;margin-bottom:12px}
.fzg-section h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fzg-section p{font-size:13px;color:var(--fzg-ink-2);line-height:1.8}
.fzg-back{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fzg-primary);
  background:#e0edff;border:none;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;
}

/* ---------- 数据页（SVG 折线图） ---------- */
.fzg-chart-card{background:var(--fzg-surface);border:1px solid var(--fzg-line);border-radius:14px;padding:16px;margin-bottom:12px}
.fzg-chart-card h3{font-size:14px;margin-bottom:8px}
.fzg-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.fzg-kpi{background:#f0f7ff;border-radius:12px;padding:12px;text-align:center}
.fzg-kpi b{font-size:18px;color:var(--fzg-primary);display:block}
.fzg-kpi span{font-size:11px;color:var(--fzg-ink-3)}

/* ---------- 我的 / 图标库 ---------- */
.fzg-profile-head{display:flex;align-items:center;gap:14px;background:var(--fzg-surface);border:1px solid var(--fzg-line);border-radius:16px;padding:16px;margin-bottom:14px}
.fzg-avatar{
  width:56px;height:56px;border-radius:50%;flex:none;color:#fff;
  background:linear-gradient(135deg,var(--fzg-primary),var(--fzg-cyan));
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
}
.fzg-list-row{display:flex;flex-direction:column}
.fzg-row{
  display:flex;align-items:center;gap:12px;background:var(--fzg-surface);
  border:1px solid var(--fzg-line);border-radius:12px;padding:14px;margin-bottom:10px;
}
.fzg-row .fzg-row-icon{color:var(--fzg-primary)}
.fzg-row b{font-size:14px;flex:1}
.fzg-row span{font-size:12px;color:var(--fzg-ink-3)}
/* 图标墙：报告中"iconfont 全部图标截图" */
.fzg-icon-wall{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fzg-icon-cell{
  background:var(--fzg-surface);border:1px dashed #bfdbfe;border-radius:12px;
  padding:12px 6px;text-align:center;color:var(--fzg-primary);
}
.fzg-icon-cell span{display:block;font-size:10px;color:var(--fzg-ink-3);margin-top:6px;font-family:monospace}

/* ---------- 底部 Tab 导航（下导航） ---------- */
.fzg-tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;height:var(--fzg-tab-h);
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--fzg-line);
  display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.fzg-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:none;background:none;cursor:pointer;color:var(--fzg-ink-3);font-size:10px;transition:.2s;
}
.fzg-tab--active{color:var(--fzg-primary);font-weight:700}

/* ---------- 桌面 / 平板扩展 ---------- */
@media (min-width:768px){
  .fzg-app{max-width:720px}
  .fzg-tabbar{max-width:720px}
  .fzg-view{padding:12px 32px 32px}
  .fzg-grid{grid-template-columns:repeat(4,1fr)}
  .fzg-icon-wall{grid-template-columns:repeat(6,1fr)}
  .fzg-kpi-row{grid-template-columns:repeat(3,1fr)}
}
</style>

/* ============================================================
   路由工具：解析 hash，如 #/product?id=2
   ============================================================ */
function fzg_parseHash(){
  var h = location.hash.replace(/^#\//,"") || "home";
  var parts = h.split("?");
  var path = parts[0] || "home";
  var query = {};
  if(parts[1]){
    parts[1].split("&").forEach(function(kv){
      var p = kv.split("=");
      query[p[0]] = decodeURIComponent(p[1]||"");
    });
  }
  return { path:path, query:query };
}
function fzg_nav(route){ location.hash = route; }

/* ----- 产品详情（三级页，从路由 query 取 id） ----- */

    return '<div class="fzg-param"><span>'+pa.k+'</span><b>'+pa.v+'</b></div>';
  }).join("");
  return ''+
  '<div class="fzg-view">'+
    '<button class="fzg-back" onclick="fzg_nav(\'#/products\')">'+fzg_icon("arrow-right","fzg-icon--sm")+' 返回列表</button>'+
    '<div style="height:12px"></div>'+
    '<div class="fzg-detail-hero">'+
      fzg_icon("radar")+
      '<h2>'+p.name+'</h2>'+
      '<p>路由参数 id = '+id+' · 型号 '+p.model+'</p>'+
    '</div>'+
    '<div class="fzg-param-grid">'+params+'</div>'+
    '<div class="fzg-section">'+
      '<h3>'+fzg_icon("signal","fzg-icon--sm")+' 设备说明</h3>'+
      '<p>'+p.detail+'</p>'+

/* ============================================================
   路由分发
   ============================================================ */
function fzg_router(){
  var r = fzg_parseHash();
  var html = "";
  if(r.path === "products") html = fzgViewProducts();
  else if(r.path === "product") html = fzgViewProduct(r.query);
  else if(r.path === "data") html = fzgViewData();
  else if(r.path === "profile") html = fzgViewProfile();
  else html = fzgViewHome();
  root.innerHTML = html;
  /* 高亮当前 tab */
  var tabPath = (r.path === "product") ? "products" : r.path;
  document.querySelectorAll(".fzg-tab").forEach(function(btn){
    btn.classList.toggle("fzg-tab--active", btn.getAttribute("data-route") === "#/"+tabPath);
  });
  window.scrollTo(0,0);
}
/* 底部 Tab 点击跳转（绑定一次，tabbar 不在 root 内不会被重渲染覆盖） */
document.querySelectorAll(".fzg-tab").forEach(function(btn){
  btn.addEventListener("click", function(){
    fzg_nav(btn.getAttribute("data-route"));
  });
});
window.addEventListener("hashchange", fzg_router);
fzg_router();
</script>
